# Inserts a blank line between shell prompts
add_newline = false
command_timeout = 1000 # Increase the timeout to 60 seconds

format = """
[$username$directory](bg:#0049B0 #ffffff)$fill[$git_branch](#ffffff)[$time](#ffffff)\
$line_break$character"""

[fill]
symbol = " "
style = "bg:#9a9a9a black"

[directory]
style = "bg:#0049B0 #ffffff)"
format = "[$path]($style)[$read_only]($style) "
truncation_length = 3
truncation_symbol = "…/"

[character]
success_symbol = "❯"
error_symbol = "×"
format = "[$symbol$state](bold #ffffff)"

[username]
format = '[ $user ](bg:#0049B0 #ffffff)'
disabled = false
show_always = true

[hostname]
ssh_only = false
format = '[$ssh_symbol](bg:#0049B0 #ffffff)[$hostname](bg:#0049B0 #ffffff) '
trim_at = '.companyname.com'
disabled = false

[git_branch]
symbol = "  "
style = "bg:#00794c #ffffff"
format = '[$symbol$branch ]($style)'

[time]
format = "[ $time ]($style)"
style = "bg:#ffb700 black"
disabled = false

[line_break]
disabled = false